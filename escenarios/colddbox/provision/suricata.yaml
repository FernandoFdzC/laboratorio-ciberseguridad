%YAML 1.1
---

vars:
  address-groups:
    HOME_NET: "[192.168.30.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

# Configuración de la interfaz (sin capture-filter, se aplicará después)
af-packet:
  - interface: eth1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

# No se soporta 'capture-filter' en esta versión, lo eliminamos.

app-layer:
  protocols:
    dnp3:
      enabled: no
    modbus:
      enabled: no

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - tls
        - files
        - smtp
        - ssh
        - flow

# Ruta para reglas personalizadas
default-rule-path: /etc/suricata/rules
rule-files:
  - local.rules